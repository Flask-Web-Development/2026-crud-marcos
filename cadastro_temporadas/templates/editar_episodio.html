{% extends "base.html" %}

{% block title %}
Editar episódio
{% endblock %}

{% block content %}

<h1>Editar episódio</h1>

<form method="POST">

    <label for="numero">Número do Episódio:</label>
    <input
        type="number"
        id="numero"
        name="numero"
        value="{{ episodio.numero }}"
        required
    >

    <label for="titulo">Título do Episódio:</label>
    <input
        type="text"
        id="titulo"
        name="titulo"
        value="{{ episodio.titulo }}"
        required
    >

    <label for="descricao">Descrição:</label>
    <textarea
        id="descricao"
        name="descricao"
        required
    >{{ episodio.descricao }}</textarea>

    <label for="data_publicacao">Data de publicação:</label>
    <input
        type="date"
        id="data_publicacao"
        name="data_publicacao"
        value="{{ episodio.data_publicacao }}"
        required
    >

    <label for="temporada_id">Temporada:</label>
    <select id="temporada_id" name="temporada_id" required>

        {% for temporada in temporadas %}
            <option
                value="{{ temporada.id }}"
                {% if temporada.id == episodio.temporada_id %}selected{% endif %}
            >
                Temporada {{ temporada.numero }} - {{ temporada.titulo }}
            </option>
        {% endfor %}

    </select>

    <button type="submit">Salvar alterações</button>

</form>

{% endblock %}
