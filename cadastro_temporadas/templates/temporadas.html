{% extends "base.html" %}

{% block title %}
Temporadas
{% endblock %}

{% block content %}

<h1>Temporadas</h1>

{% for temporada in temporadas %}

    <h2>{{ temporada.titulo }}</h2>

    <p>{{ temporada.descricao }}</p>

    <p>Status: {{ temporada.status }}</p>

    <p>Data: {{ temporada.data_publicacao }}</p>

    <a href="{{ url_for('editar_temporada', id=temporada.id) }}">
        Editar
    </a>

    <form action="{{ url_for('excluir_temporada', id=temporada.id) }}" method="POST">
    <button type="submit">Excluir</button>
    </form>

{% endfor %}

{% endblock %}
