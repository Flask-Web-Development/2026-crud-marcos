<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Cadastro de Temporadas{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>Cadastro de Temporadas</h1>

        <nav>
            <a href="{{ url_for('listar_temporadas') }}">Temporadas</a>
            <a href="{{ url_for('listar_episodios') }}">Episódios</a>
            <a href="{{ url_for('cadastrar_temporada') }}">Cadastrar temporada</a>
            <a href="{{ url_for('cadastrar_episodio') }}">Cadastrar episódio</a>
        </nav>
    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>© 2026 - Cadastro de Temporadas</p>
    </footer>

</body>
</html>
